[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "99minds-blog-writing"
version = "1.0.0"
description = "AI-powered blog creation and optimization skill for Claude Code - tailored for 99minds"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
  {name = "PiyushSingh2212"},
]

[project.optional-dependencies]
core = [
  "textstat>=0.7.3,<1.0.0",
  "beautifulsoup4>=4.12.0,<5.0.0",
]
advanced = [
  "lxml>=5.0.0,<7.0.0",
  "jsonschema>=4.20.0,<5.0.0",
  "spacy>=3.7.0,<4.0.0",
  "sentence-transformers>=2.5.0,<5.0.0",
  "scikit-learn>=1.4.0,<2.0.0",
  "language-tool-python>=2.7.1,<3.0.0",
]
google = [
  "requests>=2.32.4,<3.0.0",
  "google-api-python-client>=2.100.0,<3.0.0",
  "google-auth>=2.20.0,<3.0.0",
  "google-auth-oauthlib>=1.0.0,<2.0.0",
  "google-auth-httplib2>=0.2.0,<1.0.0",
  "google-analytics-data>=0.18.0,<1.0.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "textstat>=0.7.3,<1.0.0",
  "beautifulsoup4>=4.12.0,<5.0.0",
]
