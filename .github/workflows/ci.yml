name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        run: |
          echo "Checking all SKILL.md files have required frontmatter..."
          errors=0
          for file in $(find skills -name "SKILL.md" 2>/dev/null); do
            if ! head -1 "$file" | grep -q "^---"; then
              echo "ERROR: $file missing YAML frontmatter"
              errors=$((errors + 1))
            fi
            if ! grep -q "^name:" "$file"; then
              echo "ERROR: $file missing 'name' field"
              errors=$((errors + 1))
            fi
            if ! grep -q "^description:" "$file"; then
              echo "ERROR: $file missing 'description' field"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors validation error(s)"
            exit 1
          fi
          echo "All SKILL.md files are valid"
